name: LaMa isolated CPU benchmark
on:
  pull_request:
    branches: [lama-benchmark-base-20261127]
    paths: ['.github/workflows/lama-benchmark.yml']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install pillow numpy
      - name: Download public LaMa weights
        run: |
          curl -fL --retry 2 --max-time 180 https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt -o big-lama.pt
          echo 'e3aa4aaa15225a33ec84f9f4bc47e500  big-lama.pt' | md5sum -c -
      - name: Run synthetic image restoration benchmark
        run: |
          python - <<'PY'
          import time, os, json
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import torch
          torch.set_num_threads(min(4,os.cpu_count() or 1))
          model=torch.jit.load('big-lama.pt',map_location='cpu').eval()
          for size in (512,1024):
              image=Image.new('RGB',(size,size),'#ded5c5')
              d=ImageDraw.Draw(image)
              d.rectangle((0,size*3//4,size,size),fill='#8d8172')
              d.rounded_rectangle((size//4,size//4,size*3//4,size*4//5),radius=size//60,fill='#ae8152',outline='#67492d',width=3)
              for i in range(2):
                  y=size//3+i*size//5
                  d.rectangle((size//4+10,y,size*3//4-10,y+size//6),outline='#67492d',width=3)
                  d.rounded_rectangle((size*45//100,y+size//14,size*55//100,y+size//14+6),radius=3,fill='#302c29')
              mask=Image.new('L',(size,size),0)
              draw=ImageDraw.Draw(mask)
              font=ImageFont.truetype('DejaVuSans.ttf',size//15)
              for x,y in ((size//10,size//6),(size//3,size//2),(size//2,size*7//10)):
                  draw.text((x,y),'TEST',font=font,fill=255)
              source=np.array(image)
              m=np.asarray(mask)>0
              marked=source.copy()
              marked[m]=255
              region=np.asarray(mask.filter(ImageFilter.MaxFilter(7)))>0
              im=torch.from_numpy(marked.copy()).permute(2,0,1).unsqueeze(0).float()/255
              ma=torch.from_numpy(region.copy()).unsqueeze(0).unsqueeze(0).float()
              times=[]
              for n in range(1):
                  start=time.perf_counter()
                  with torch.inference_mode(): out=model(im,ma)
                  times.append(round(time.perf_counter()-start,3))
              restored=(out[0].permute(1,2,0).clamp(0,1).numpy()*255).astype('uint8')
              restored=np.where(region[:,:,None],restored,marked)
              mae=float(np.abs(restored.astype(float)-source)[region].mean())
              print('LAMA_BENCHMARK',json.dumps(dict(size=size,seconds=times,masked_mae=mae,unchanged_outside=bool(np.array_equal(restored[~region],source[~region])))),flush=True)
          # Compare full-resolution inference with native-resolution localized patches.
          import statistics
          size=1024
          rng=np.random.default_rng(42)
          yy,xx=np.indices((size,size))
          grain=(8*np.sin(xx/4+np.sin(yy/65))+3*rng.normal(size=(size,size)))
          base=np.stack([160+grain,117+grain,75+grain],axis=-1).clip(0,255).astype('uint8')
          source_img=Image.fromarray(base)
          d=ImageDraw.Draw(source_img)
          for j in range(6):
              y=90+j*155
              d.line((0,y,size,y+30),fill='#574338',width=6)
              d.rounded_rectangle((330,y+45,670,y+58),radius=5,fill='#312d2a')
          source=np.array(source_img)
          mask=Image.new('L',(size,size),0)
          d=ImageDraw.Draw(mask)
          f=ImageFont.truetype('DejaVuSans.ttf',32)
          boxes=[]
          for x,y in ((90,120),(430,460),(725,800)):
              d.text((x,y),'TEST 2026',font=f,fill=255)
              boxes.append(d.textbbox((x,y),'TEST 2026',font=f))
          marked=source.copy()
          marked[np.asarray(mask)>0]=255
          region=np.asarray(mask.filter(ImageFilter.MaxFilter(7)))>0
          def repair(arr,mask):
              a=torch.from_numpy(arr.copy()).permute(2,0,1).unsqueeze(0).float()/255
              m=torch.from_numpy(mask.copy()).unsqueeze(0).unsqueeze(0).float()
              with torch.inference_mode(): p=model(a,m)
              p=(p[0].permute(1,2,0).clamp(0,1).numpy()*255).astype('uint8')
              return np.where(mask[:,:,None],p,arr)
          start=time.perf_counter()
          full=repair(marked,region)
          full_s=time.perf_counter()-start
          def patch_repair():
              result=marked.copy()
              for x1,y1,x2,y2 in boxes:
                  w=320
                  x=max(0,min(size-w,(x1+x2-w)//2))
                  y=max(0,min(size-w,(y1+y2-w)//2))
                  result[y:y+w,x:x+w]=repair(result[y:y+w,x:x+w],region[y:y+w,x:x+w])
              return result
          start=time.perf_counter()
          patch=patch_repair()
          patch_s=time.perf_counter()-start
          for label,result,elapsed in [('full',full,full_s),('patch',patch,patch_s)]:
              print('LAMA_PATCH_BENCHMARK',json.dumps(dict(mode=label,seconds=round(elapsed,3),masked_mae=float(np.abs(result.astype(float)-source)[region].mean()),unchanged_outside=bool(np.array_equal(result[~region],source[~region])))),flush=True)
          os.makedirs('benchmark-output',exist_ok=True)
          for name,arr in [('original',source),('test-input',marked),('full',full),('patch',patch)]:
              Image.fromarray(arr).save('benchmark-output/'+name+'.png')
          # Nine separate synthetic images; measure sustained inference with known edit masks.
          batch_times=[]
          batch_errors=[]
          batch_preserved=[]
          for i in range(9):
              shift=(i*17,i*23)
              target=np.roll(source,shift,axis=(0,1))
              inp=np.roll(marked,shift,axis=(0,1))
              roi=np.roll(region,shift,axis=(0,1))
              result=inp.copy()
              start=time.perf_counter()
              for x1,y1,x2,y2 in boxes:
                  w=320
                  x=max(0,min(size-w,(x1+x2-w)//2+shift[1]))
                  y=max(0,min(size-w,(y1+y2-w)//2+shift[0]))
                  result[y:y+w,x:x+w]=repair(result[y:y+w,x:x+w],roi[y:y+w,x:x+w])
              elapsed=time.perf_counter()-start
              batch_times.append(round(elapsed,3))
              batch_errors.append(round(float(np.abs(result.astype(float)-target)[roi].mean()),3))
              batch_preserved.append(bool(np.array_equal(result[~roi],target[~roi])))
          print('LAMA_BATCH_BENCHMARK',json.dumps(dict(count=9,seconds=batch_times,total_seconds=round(sum(batch_times),3),mean_seconds=round(statistics.mean(batch_times),3),max_seconds=max(batch_times),masked_mae=batch_errors,unchanged_outside=all(batch_preserved))),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lama-synthetic-comparison
          path: benchmark-output/
          retention-days: 3
